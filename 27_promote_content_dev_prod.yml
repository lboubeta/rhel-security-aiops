---

- name: Promote Satellite Content View from Dev to Prod
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files: vars/main.yml
  tasks:
    - name: Resolve CVE context
      ansible.builtin.set_fact:
        cve_name: "{{ cve_name | default(ansible_eda.event.payload.reported_cve | default('n/a')) }}"

    - name: Promote {{ satellite_content_view }} from {{ satellite_lifecycle_env_source }} to {{ satellite_lifecycle_env_target }}
      redhat.satellite.content_view_version:
        server_url: "{{ satellite_server_url }}"
        username: "{{ satellite_username }}"
        password: "{{ satellite_password }}"
        validate_certs: "{{ satellite_validate_certs | default(true) }}"
        organization: "{{ satellite_organization }}"
        content_view: "{{ satellite_content_view }}"
        current_lifecycle_environment: "{{ satellite_lifecycle_env_source }}"
        lifecycle_environments:
          - "{{ satellite_lifecycle_env_target }}"
        description: >-
          Promote {{ satellite_content_view }}
          {{ satellite_lifecycle_env_source }} -> {{ satellite_lifecycle_env_target }}
          for {{ cve_name }}
        force_promote: "{{ satellite_force_promote | default(false) }}"
      register: promote_result

    - name: Publish promotion artifacts
      ansible.builtin.set_stats:
        data:
          cve_name: "{{ cve_name }}"
          satellite_content_view: "{{ satellite_content_view }}"
          satellite_promoted_from: "{{ satellite_lifecycle_env_source }}"
          satellite_promoted_to: "{{ satellite_lifecycle_env_target }}"
          satellite_promote_changed: "{{ promote_result.changed }}"
