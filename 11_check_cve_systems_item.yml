---
- block:
    - name: Handle 1 CVEs item and Launch Job Workflow Template
      vars:
        aap_hostname: "https://{{ aap_fqdn }}"
        aap_username: admin
        aap_password: "{{ admin_password }}"
        aap_validate_certs: true
        extra_vars:
          ansible_eda:
            event:
              payload:
                events:
                  - payload:
                      reported_cve: "{{ item.payload.reported_cve }}"
                      publish_date: "{{ item.payload.publish_date }}"
                      known_exploit: "{{ item.payload.known_exploit }}"
                      demo_has_remediation: "{{ item.payload.demo_has_remediation | default(true) }}"
        controller_workflow_launch_jobs:
          - name: "AWS AIOps: MITIGATION & REMEDIATION Workflow"
            organization: Default
            extra_vars: "{{ extra_vars }}"
      ansible.builtin.include_role:
        name: infra.aap_configuration.controller_workflow_launch
  rescue:
    - name: Record failure for {{ item.payload.reported_cve }}
      ansible.builtin.debug:
        msg: "CVE Failed: {{ item.payload.reported_cve }}"
