# Playbook: mitigate CVE‑2026‑31431 on RHEL nodes
# ------------------------------------------------
# This playbook does **not** install any packages or replace the kernel.
# It adds kernel‑command‑line arguments that blacklist the vulnerable
# initialization functions (see Red Hat advisory RHSB‑2026‑002):
#   • initcall_blacklist=algif_aead_init
#   • initcall_blacklist=af_alg_init   (optional, blocks the whole af_alg interface)
#   • initcall_blacklist=crypto_authenc_esn_module_init (optional, blocks the specific algorithm)
# After updating the boot loader configuration the nodes are rebooted so the
# new arguments take effect.

- name: Apply CVE‑2026‑31431 mitigation to RHEL hosts
  hosts: rhel
  become: true
  gather_facts: yes
  tasks:

    - name: Verify the target OS is Red Hat Enterprise Linux
      ansible.builtin.assert:
        that:
          - ansible_facts['os_family'] == "RedHat"
        fail_msg: "This playbook only supports RHEL. Skipping host {{ inventory_hostname }}."
      tags: verify_os

    - name: Gather current GRUB command‑line arguments
      ansible.builtin.command: grubby --info=ALL
      register: grubby_info
      changed_when: false
      tags: gather_grub

    - name: Ensure initcall_blacklist for algif_aead_init is present
      ansible.builtin.command: >
        grubby --update-kernel=ALL
        --args="initcall_blacklist=algif_aead_init"
      when: "'initcall_blacklist=algif_aead_init' not in grubby_info.stdout"
      notify: Reboot host
      tags: blacklist_algif_aead

    - name: (Optional) Ensure initcall_blacklist for af_alg_init is present
      ansible.builtin.command: >
        grubby --update-kernel=ALL
        --args="initcall_blacklist=af_alg_init"
      when:
        - "'initcall_blacklist=af_alg_init' not in grubby_info.stdout"
        # set to true to enable this extra hardening
        - false
      notify: Reboot host
      tags: blacklist_af_alg

    - name: (Optional) Ensure initcall_blacklist for crypto_authenc_esn_module_init is present
      ansible.builtin.command: >
        grubby --update-kernel=ALL
        --args="initcall_blacklist=crypto_authenc_esn_module_init"
      when:
        - "'initcall_blacklist=crypto_authenc_esn_module_init' not in grubby_info.stdout"
        # set to true to enable this extra hardening
        - false
      notify: Reboot host
      tags: blacklist_authenc

    - name: Verify that the new kernel arguments are now present
      ansible.builtin.command: grubby --info=ALL
      register: grubby_check
      changed_when: false
      tags: verify_blacklist

    - name: Show final kernel command‑line for audit purposes
      ansible.builtin.debug:
        msg: |
          {{ inventory_hostname }} kernel arguments after mitigation:
          {{ grubby_check.stdout_lines | map('regex_search', 'args=.*') | list }}
      tags: audit

  handlers:

    - name: Reboot host
      ansible.builtin.reboot:
        reboot_timeout: 600
        test_command: whoami      # simple test to confirm the host is back online
      listen: Reboot host
      tags: reboot
