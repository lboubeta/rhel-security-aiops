---
# Create / update AAP Job Templates via infra.aap_configuration.
#
# Launch with extra_vars / survey fields, e.g.:
#   jt_name, jt_organization, jt_inventory, jt_project, jt_playbook,
#   jt_credentials, jt_ask_limit_on_launch, jt_ask_variables_on_launch
#
# Auth via Controller credential on the JT (CONTROLLER_*) or:
#   aap_hostname + aap_username/aap_password or aap_token
- name: Create AAP Job Templates
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - vars/main.yml

  pre_tasks:
    - name: Require Controller API connection and JT essentials
      ansible.builtin.assert:
        that:
          - (jt_name | default('') | length) > 0
          - (jt_organization | default('') | length) > 0
          - (jt_inventory | default('') | length) > 0
          - (jt_project | default('') | length) > 0
          - (jt_playbook | default('') | length) > 0
        fail_msg: >-
          Need jt_name, jt_organization, jt_inventory, jt_project, jt_playbook.

    - name: Normalize credentials to a list
      ansible.builtin.set_fact:
        jt_credentials_list: >-
          {{
            jt_credentials
            if (jt_credentials is defined
                and jt_credentials is sequence
                and jt_credentials is not string)
            else (
              (jt_credentials | default('', true) | string).split(',')
              | map('trim')
              | reject('equalto', '')
              | list
            )
          }}

    - name: Normalize prompt-on-launch flags from launch params
      ansible.builtin.set_fact:
        # Only params present in the last launch are set; missing → false
        ask_limit: "{{ (jt_ask_limit_on_launch | default('no', true) | string | lower) in ['true', 'yes', '1'] }}"
        ask_variables: "{{ (jt_ask_variables_on_launch | default('no', true) | string | lower) in ['true', 'yes', '1'] }}"
        ask_inventory: "{{ (jt_ask_inventory_on_launch | default('no', true) | string | lower) in ['true', 'yes', '1'] }}"
        ask_credential: "{{ (jt_ask_credential_on_launch | default('no', true) | string | lower) in ['true', 'yes', '1'] }}"
        enable_survey: "{{ (jt_enable_survey | default('no', true) | string | lower) in ['true', 'yes', '1'] }}"

    - name: Load optional survey_spec for the created JT
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/vars/create_job_templates_created_jt_survey.yml"
        name: created_jt_survey_spec
      when: enable_survey | bool

    - name: Build controller_templates payload
      ansible.builtin.set_fact:
        controller_templates:
          - name: "{{ jt_name }}"
            description: "{{ jt_description | default('', true) }}"
            job_type: run
            organization: "{{ jt_organization }}"
            inventory: "{{ jt_inventory }}"
            project: "{{ jt_project }}"
            playbook: "{{ jt_playbook }}"
            credentials: "{{ jt_credentials_list }}"
            ask_inventory_on_launch: "{{ ask_inventory | bool }}"
            ask_credential_on_launch: "{{ ask_credential | bool }}"
            ask_limit_on_launch: "{{ ask_limit | bool }}"
            ask_variables_on_launch: "{{ ask_variables | bool }}"
            survey_enabled: "{{ enable_survey | bool }}"
            state: present

    - name: Add execution environment when provided
      ansible.builtin.set_fact:
        controller_templates: >-
          {{
            [controller_templates[0] | combine({
              'execution_environment': jt_execution_environment
            })]
          }}
      when:
        - jt_execution_environment is defined
        - jt_execution_environment | length > 0

    - name: Attach survey_spec when enabled
      ansible.builtin.set_fact:
        controller_templates: >-
          {{
            [controller_templates[0] | combine({
              'survey_spec': created_jt_survey_spec
            })]
          }}
      when: enable_survey | bool

    - name: Show Job Template definition to create
      ansible.builtin.debug:
        var: controller_templates

  roles:
    - role: infra.aap_configuration.controller_job_templates
      when: controller_templates is defined
