---

- name: Check CVE Remediations
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files: vars/main.yml
  tasks:
    - name: Resolve CVE event payload (AO flat or Insights events[])
      ansible.builtin.set_fact:
        payload: >-
          {{
            ansible_eda.event.payload.events[0].payload
            if (ansible_eda.event.payload.events is defined
                and ansible_eda.event.payload.events | length > 0)
            else ansible_eda.event.payload
          }}

    - name: Resolve CVE name
      ansible.builtin.set_fact:
        cve_name: "{{ cve_name | default(payload.reported_cve, true) }}"

    - name: Get Lightspeed access token using Service Account Client ID and Secret
      ansible.builtin.uri:
        url: https://sso.redhat.com/auth/realms/redhat-external/protocol/openid-connect/token
        method: POST
        body_format: "form-urlencoded"
        body:
          grant_type: client_credentials
          client_id: "{{ lightspeed_client_id }}"
          client_secret: "{{ lightspeed_client_secret }}"
        status_code: 200
      register: sso_response

    - name: Query Lightspeed for {{ cve_name }}
      ansible.builtin.uri:
        url: "https://console.redhat.com/api/vulnerability/v1/cves/{{ cve_name }}"
        method: GET
        headers:
          Authorization: "Bearer {{ sso_response.json.access_token }}"
        status_code: 200
      register: cve_response

    - name: Decide remediation availability for {{ cve_name }}
      ansible.builtin.set_fact:
        # real check (Lightspeed rules/advisories):
        # has_remediation: >-
        #   {{ (cve_response.json.data.attributes.rules | length > 0)
        #      or (cve_response.json.data.attributes.advisories_list | default([]) | length > 0) }}
        # demo check:
        has_remediation: "{{ payload.demo_has_remediation | default(false) | bool }}"

    - name: Publish remediation decision for AO switch
      ansible.builtin.set_stats:
        data:
          has_remediation: "{{ has_remediation | bool }}"
