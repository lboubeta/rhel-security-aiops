---
- name: Trigger EDA webhook
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Flatten Insights events[] into singular event for AO
      ansible.builtin.set_fact:
        ao_event_payload: >-
          {{
            ansible_eda.event.payload
            | dict2items
            | rejectattr('key', 'equalto', 'events')
            | list
            | items2dict
            | combine({'event': ansible_eda.event.payload.events[0]})
          }}

    - name: Obtain OAuth token
      ansible.builtin.uri:
        url: "{{ webhook_base_url }}/api/v1/auth/token"
        method: POST
        body_format: form-urlencoded
        body:
          grant_type: client_credentials
          client_id: "{{ webhook_client_id }}"
          client_secret: "{{ webhook_client_secret }}"
        status_code: 200
        validate_certs: false
      register: token_response

    - name: Post flattened event payload to AO EDA trigger endpoint
      ansible.builtin.uri:
        url: "{{ webhook_base_url }}/api/v1/webhooks/eda/{{ webhook_path }}"
        method: POST
        body_format: json
        headers:
          Authorization: "Bearer {{ token_response.json.access_token }}"
          Content-Type: "application/json"
        body: "{{ ao_event_payload }}"
        status_code: 202
        validate_certs: false
      register: webhook_response

    - name: Display execution ID
      ansible.builtin.debug:
        msg: "Workflow execution started: {{ webhook_response.json.execution_id }}"
