---

- name: Store Code in Git (Remediation)
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files: vars/main.yml
  tasks:
    - name: Resolve CVE name from artifact or event payload
      ansible.builtin.set_fact:
        cve_name: >-
          {{
            cve_name
            | default(
                (
                  ansible_eda.event.payload.events[0].payload.reported_cve
                  if (ansible_eda.event.payload.events is defined
                      and ansible_eda.event.payload.events | length > 0)
                  else ansible_eda.event.payload.reported_cve
                ),
                true
              )
          }}

    - name: Require downloaded remediation playbook artifact
      ansible.builtin.assert:
        that:
          - downloaded_playbook is defined
          - downloaded_playbook | length > 0
        fail_msg: >-
          downloaded_playbook artifact is missing. Run "24. Get CVE Remediation"
          before this node.

    - name: Retrieve a repository (Remediation)
      ansible.scm.git_retrieve:
        origin:
          url: "{{ github_url }}"
        upstream:
          url: "{{ github_url }}"
        branch:
          name: "{{ github_branch }}"
          duplicate_detection: false
      register: repository

    - name: Copy playbook content to the GIT folder (Remediation)
      ansible.builtin.copy:
        content: "{{ downloaded_playbook }}"
        dest: "{{ repository['path'] }}/playbook_remediation_{{ cve_name }}.yml"
        force: true
        mode: '0644'

    - name: Publish the changes (Remediation)
      ansible.scm.git_publish:
        commit:
          message: "Adding new playbook remediation.yml for {{ cve_name }}"
        path: "{{ repository['path'] }}"
        user:
          name: "{{ github_user }}"
          email: "{{ github_email }}"
        token: "{{ github_token }}"
