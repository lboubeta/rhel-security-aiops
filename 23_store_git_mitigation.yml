---

- name: Store Code in Git (Mitigation)
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files: vars/main.yml
  tasks:
    - name: Resolve playbook filename and CVE context
      ansible.builtin.set_fact:
        playbook_filename: "{{ playbook_name | default('playbook_mitigation.yml') }}"
        playbook_yaml: "{{ playbook_content }}"
        cve_name: "{{ cve_name | default(ansible_eda.event.payload.reported_cve | default('unknown-cve'), true) }}"

    - name: Assert playbook YAML content is present
      ansible.builtin.assert:
        that:
          - playbook_yaml is string
          - playbook_yaml | length > 0
          - playbook_filename is string
          - playbook_filename | length > 0
        fail_msg: >-
          Expected playbook_content (YAML string) and playbook_name (filename).
          Got playbook_content type={{ playbook_content | type_debug }},
          playbook_name={{ playbook_name | default('undefined') }}

    - name: Retrieve a repository (Mitigation)
      ansible.scm.git_retrieve:
        origin:
          url: "{{ github_url }}"
        upstream:
          url: "{{ github_url }}"
        branch:
          name: "{{ github_branch }}"
          duplicate_detection: false
      register: repository

    - name: Copy playbook content to the GIT folder (Mitigation)
      ansible.builtin.copy:
        content: "{{ playbook_yaml }}"
        dest: "{{ repository['path'] }}/{{ playbook_filename }}"
        force: true
        mode: '0644'

    - name: Publish the changes
      ansible.scm.git_publish:
        commit:
          message: "Adding {{ playbook_filename }} for {{ cve_name }}"
        path: "{{ repository['path'] }}"
        user:
          name: "{{ github_user }}"
          email: "{{ github_email }}"
        token: "{{ github_token }}"
